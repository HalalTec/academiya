function switchLanguage(lang) {
    const t = translations[lang];
    if (!t) return;

    localStorage.setItem("app_lang", lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir || (lang === "ar" ? "rtl" : "ltr");
    document.title = t.app_title || document.title;

    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (Object.prototype.hasOwnProperty.call(t, key)) el.textContent = t[key];
    });

    const desktop = document.getElementById("langSelect");
    if (desktop) desktop.value = lang;
    if (mobile) mobile.value = lang;

}

const validSections = ["home","about","programs","admissions","elearning","students","media","contact"];

function navigateTo(sectionId) {
    if (!validSections.includes(sectionId)) sectionId = "home";

    document.querySelectorAll(".page-section").forEach(s => s.classList.remove("active"));
    document.getElementById(sectionId)?.classList.add("active");

    document.querySelectorAll(".nav-link").forEach(link => link.classList.remove("active"));
    document.getElementById(`nav-${sectionId}`)?.classList.add("active");

    if (window.location.hash !== `#${sectionId}`) {
        history.replaceState(null, "", `#${sectionId}`);
    }

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function mobileNavigate(sectionId) {
    navigateTo(sectionId);
    closeMobileMenu();
}

    function toggleMobileMenu() {
        const menu = document.getElementById("mobileMenu");
        const drawer = document.getElementById("mobileDrawer");
        const button = document.getElementById("mobileMenuButton");
        const icon = document.getElementById("mobileMenuIcon");

        if (!menu || !drawer) {
            return;
        }

        const isClosed = menu.classList.contains("hidden");

        if (isClosed) {
            // Display overlay first
            menu.classList.remove("hidden");

            document.body.classList.add("menu-open");

            if (button) {
                button.setAttribute("aria-expanded", "true");
            }

            if (icon) {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-xmark");
            }

            // Then animate overlay + drawer
            requestAnimationFrame(() => {
                menu.classList.remove("opacity-0");
                drawer.classList.remove("translate-x-full");
            });
        } else {
            closeMobileMenu();
        }
    }

    function closeMobileMenu() {
        const menu = document.getElementById("mobileMenu");
        const drawer = document.getElementById("mobileDrawer");
        const button = document.getElementById("mobileMenuButton");
        const icon = document.getElementById("mobileMenuIcon");

        if (!menu || !drawer) {
            return;
        }

        // Fade overlay out
        menu.classList.add("opacity-0");

        // Move drawer off screen
        drawer.classList.add("translate-x-full");

        document.body.classList.remove("menu-open");

        if (button) {
            button.setAttribute("aria-expanded", "false");
        }

        if (icon) {
            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        }

        setTimeout(() => {
            menu.classList.add("hidden");
        }, 300);
    }

function handleMobileBackdropClick(event) {
    if (event.target === document.getElementById("mobileMenu")) closeMobileMenu();
}

function loadSectionFromHash() {
    const section = window.location.hash.replace("#", "");
    navigateTo(validSections.includes(section) ? section : "home");
}

document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeMobileMenu();
});

document.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem("app_lang");
    const initialLang = translations[savedLang] ? savedLang : "ar";
    switchLanguage(initialLang);
    loadSectionFromHash();
});

window.addEventListener("hashchange", loadSectionFromHash);
</script>
